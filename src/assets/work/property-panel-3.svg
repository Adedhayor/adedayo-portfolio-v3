<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Node by Section matrix">
  <rect width="1600" height="1000" fill="#111111"/>
  <text x="120" y="130" fill="#f5f3ef" fill-opacity="0.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="6" font-weight="500">RESEARCH → DECISIONS · THE HERO ARTIFACT</text>
  <text x="116" y="250" fill="#f5f3ef" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="600" letter-spacing="-3">Node × Section Matrix</text>
  <!-- matrix grid: 6 cols (node types) x 5 rows (sections) -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1">
    <!-- verticals -->
    <line x1="320" y1="320" x2="320" y2="860"/>
    <line x1="510" y1="320" x2="510" y2="860"/>
    <line x1="700" y1="320" x2="700" y2="860"/>
    <line x1="890" y1="320" x2="890" y2="860"/>
    <line x1="1080" y1="320" x2="1080" y2="860"/>
    <line x1="1270" y1="320" x2="1270" y2="860"/>
    <line x1="1460" y1="320" x2="1460" y2="860"/>
    <!-- horizontals -->
    <line x1="130" y1="320" x2="1460" y2="320"/>
    <line x1="130" y1="428" x2="1460" y2="428"/>
    <line x1="130" y1="536" x2="1460" y2="536"/>
    <line x1="130" y1="644" x2="1460" y2="644"/>
    <line x1="130" y1="752" x2="1460" y2="752"/>
    <line x1="130" y1="860" x2="1460" y2="860"/>
  </g>
  <!-- a few filled cells to suggest coverage -->
  <g>
    <rect x="322" y="322" width="186" height="104" fill="#3b6ef5" fill-opacity="0.28"/>
    <rect x="702" y="430" width="186" height="104" fill="#2fa36b" fill-opacity="0.28"/>
    <rect x="1082" y="538" width="186" height="104" fill="#d98a1f" fill-opacity="0.28"/>
    <rect x="512" y="646" width="186" height="104" fill="#3b6ef5" fill-opacity="0.2"/>
    <rect x="892" y="754" width="186" height="104" fill="#2fa36b" fill-opacity="0.2"/>
  </g>
  <text x="130" y="380" fill="#f5f3ef" fill-opacity="0.55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Identity</text>
  <text x="130" y="488" fill="#f5f3ef" fill-opacity="0.55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Layout</text>
  <text x="130" y="596" fill="#f5f3ef" fill-opacity="0.55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Fill</text>
  <text x="130" y="704" fill="#f5f3ef" fill-opacity="0.55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Stroke</text>
  <text x="130" y="812" fill="#f5f3ef" fill-opacity="0.55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Effects</text>
  <text x="120" y="935" fill="#c8ff2d" fill-opacity="0.7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="3">PLACEHOLDER — SWAP FOR REAL MATRIX ARTIFACT</text>
</svg>
