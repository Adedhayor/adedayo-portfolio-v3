<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Inkwell token layers">
  <rect width="1600" height="1000" fill="#111111"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="250" x2="1600" y2="250"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>
  <text x="120" y="150" fill="#f5f3ef" fill-opacity="0.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="6" font-weight="500">PRIMITIVE → SEMANTIC → COMPONENT</text>
  <text x="116" y="400" fill="#f5f3ef" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600" letter-spacing="-4">Token layers</text>
  <!-- three stacked layers -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="120" y="500" width="1360" height="90" fill="#1a1a1a" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="150" y="558" fill="#f5f3ef" fill-opacity="0.75" font-size="34">Primitive — raw colour scales, spacing, type, elevation</text>
    <rect x="120" y="610" width="1360" height="90" fill="#161616" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="150" y="668" fill="#f5f3ef" fill-opacity="0.75" font-size="34">Semantic — primary · surface · info · success · warning · danger</text>
    <rect x="120" y="720" width="1360" height="90" fill="#121212" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="150" y="778" fill="#f5f3ef" fill-opacity="0.75" font-size="34">Component — buttons, inputs, controls built from tokens</text>
  </g>
  <rect x="1420" y="120" width="60" height="60" fill="#c8ff2d"/>
  <text x="120" y="930" fill="#c8ff2d" fill-opacity="0.7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="3">PLACEHOLDER — SWAP FOR REAL TOKEN CAPTURE</text>
</svg>
