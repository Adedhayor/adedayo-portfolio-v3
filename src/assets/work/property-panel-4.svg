    <rect x="1180" y="262" width="280" height="150" rx="2" fill="#12203f" stroke="#3b6ef5" stroke-opacity="0.5"/>
    <text x="1196" y="298" fill="#8fb0ff" font-size="24">Identity</text>
    <text x="1196" y="336" fill="#f5f3ef" fill-opacity="0.6" font-size="22">Semantic type · Zone</text>
    <text x="1196" y="372" fill="#f5f3ef" fill-opacity="0.6" font-size="22">Variant · Token bindings</text>
    <g stroke="#ffffff" stroke-opacity="0.1">
      <line x1="1180" y1="452" x2="1460" y2="452"/>
      <line x1="1180" y1="532" x2="1460" y2="532"/>
