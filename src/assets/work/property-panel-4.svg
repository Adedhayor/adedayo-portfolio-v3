<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Identity-first inspector">
  <rect width="1600" height="1000" fill="#111111"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="250" x2="1600" y2="250"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>
  <text x="120" y="140" fill="#f5f3ef" fill-opacity="0.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="6" font-weight="500">AFTER · GROUPED, LABELLED, SEMANTIC-FIRST</text>
  <text x="116" y="330" fill="#f5f3ef" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="600" letter-spacing="-4">An opinion, at last</text>
  <!-- inspector with pinned Identity group -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="1160" y="170" width="320" height="760" fill="#161616" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="1180" y="196" width="280" height="46" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-opacity="0.12"/>
