  <text x="120" y="560" fill="#f5f3ef" fill-opacity="0.6" font-size="32" font-family="'Helvetica Neue', Arial, sans-serif">Identity pinned first · predictable order · collapse that persists.</text>
  <text x="120" y="930" fill="#c8ff2d" fill-opacity="0.7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="3">PLACEHOLDER — SWAP FOR REAL AFTER-STATE CAPTURE</text>
