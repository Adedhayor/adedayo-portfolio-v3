  </g>
  <text x="120" y="150" fill="#f5f3ef" fill-opacity="0.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="6" font-weight="500">AUDIT · SURFACE + CODE</text>
  <text x="116" y="470" fill="#f5f3ef" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600" letter-spacing="-4">The audit board</text>
