  <g>
    <rect x="120" y="640" width="200" height="140" fill="#1a1a1a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="344" y="640" width="200" height="140" fill="#1a1a1a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="568" y="640" width="200" height="140" fill="#1a1a1a" stroke="#d1483f" stroke-opacity="0.5"/>
    <rect x="792" y="640" width="200" height="140" fill="#1a1a1a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="1016" y="640" width="200" height="140" fill="#1a1a1a" stroke="#d98a1f" stroke-opacity="0.5"/>
  </g>
  <text x="120" y="930" fill="#c8ff2d" fill-opacity="0.7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="3">PLACEHOLDER — SWAP FOR REAL AUDIT CAPTURE</text>
