<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Inkwell components in Storybook">
  <rect width="1600" height="1000" fill="#111111"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="250" x2="1600" y2="250"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>
  <text x="120" y="150" fill="#f5f3ef" fill-opacity="0.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="6" font-weight="500">THE INK AESTHETIC · STORYBOOK</text>
  <text x="116" y="400" fill="#f5f3ef" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600" letter-spacing="-4">Ink components</text>
  <!-- mock control rail: 32px controls at 2px radius, hairline dividers -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="120" y="500" width="440" height="360" fill="#161616" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="150" y="540" width="380" height="46" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="150" y="606" width="380" height="46" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-opacity="0.12"/>
    <line x1="150" y1="682" x2="530" y2="682" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="150" y="706" width="180" height="46" rx="2" fill="#3b6ef5"/>
    <rect x="346" y="706" width="184" height="46" rx="2" fill="#1f1f1f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="620" y="560" fill="#f5f3ef" fill-opacity="0.7" font-size="34">300px rail · 32px controls · 2px radius</text>
    <text x="620" y="620" fill="#f5f3ef" fill-opacity="0.7" font-size="34">Hairlines, not shadows · mono numerics</text>
    <text x="620" y="680" fill="#f5f3ef" fill-opacity="0.7" font-size="34">Quiet neutral state · no pills</text>
  </g>
  <text x="120" y="930" fill="#c8ff2d" fill-opacity="0.7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" letter-spacing="3">PLACEHOLDER — SWAP FOR REAL COMPONENT CAPTURE</text>
</svg>
